name: "TVDB Community Fix"
guid: "721dc021-4ae6-45bf-82da-f4b89aef2f30"
imageUrl: "https://repo.jellyfin.org/releases/plugin/images/jellyfin-plugin-tvdb.png"
version: 22.1.4.0
targetAbi: "10.11.8.0"
framework: "net9.0"
owner: "superuser404notfound"
overview: "TheTVDB metadata with the altdvd / alttwo workaround applied"
description: >
  Drop-in replacement for the official TheTVDB plugin that adds a workaround
  for the upstream TVDB v4 API bug where /series/{id}/episodes/altdvd and
  /alttwo return an empty episodes array. When the primary endpoint comes
  back empty, the plugin falls back to walking the extended series record
  and aggregating episodes per matching season. See
  https://github.com/thetvdb/v4-api/issues/340 and
  https://github.com/jellyfin/jellyfin-plugin-tvdb/issues/226.

category: "MoviesAndShows"
artifacts:
  - "Jellyfin.Plugin.Tvdb.dll"
  - "Tvdb.Sdk.dll"
changelog: |-
  - 22.1.4.0: rewrite the seasonNumber / number on aggregated episodes with the alternate season's own number and the in-season position, so SxE matching resolves to the right TVDB id instead of the aired-order coincidence match.
  - 22.1.3.0: log cache hits / misses in GetEpisodeTvdbId so we can see exactly where execution diverts.
  - 22.1.2.0: diagnostic logging around the workaround (entry/exit, season-type slugs found, per-season episode counts) to help debug edge cases.
  - 22.1.1.0: also route GetEpisodeTvdbId through the per-season fallback for altdvd / alttwo (fixes per-episode metadata lookups).
  - 22.1.0.0: workaround for upstream TVDB API bug affecting altdvd / alttwo season types (#226, thetvdb/v4-api#340).
